<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácora de Mantenimiento</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#0c1c22;
    --panel:#17313a;
    --panel-2:#1c3b45;
    --text:#eef3f1;
    --muted:#93a8ae;
    --line:rgba(238,243,241,0.09);
    --accent:#ff9700;
    --accent-ink:#11242b;
    --ok:#4fa97a;
    --bg:#11242b;
    --danger:#e2543e;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="light"]){
      --ink:#20302f; --panel:#fbf7ec; --panel-2:#f3ecd9; --text:#1c2b2a;
      --muted:#5e6e6a; --line:rgba(28,43,42,0.12); --accent:#c2680a;
      --accent-ink:#fff6e8; --ok:#2f6e4c; --bg:#f1ead9; --danger:#a9382a;
    }
  }
  :root[data-theme="light"]{
    --ink:#20302f; --panel:#fbf7ec; --panel-2:#f3ecd9; --text:#1c2b2a;
    --muted:#5e6e6a; --line:rgba(28,43,42,0.12); --accent:#c2680a;
    --accent-ink:#fff6e8; --ok:#2f6e4c; --bg:#f1ead9; --danger:#a9382a;
  }
  :root[data-theme="dark"]{
    --ink:#0c1c22; --panel:#17313a; --panel-2:#1c3b45; --text:#eef3f1;
    --muted:#93a8ae; --line:rgba(238,243,241,0.09); --accent:#ff9700;
    --accent-ink:#11242b; --ok:#4fa97a; --bg:#11242b; --danger:#e2543e;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:2.5rem 1.25rem 5rem;
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  .page{max-width:920px; margin:0 auto;}

  header.top{
    display:flex; flex-direction:column; gap:.4rem;
    padding-bottom:1.5rem; margin-bottom:1.5rem;
    border-bottom:1px solid var(--line);
  }
  .brand-logo{ display:block; height:44px; width:auto; margin-bottom:.4rem; border-radius:6px; align-self:flex-start; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem;
    letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
  }
  h1{
    font-family:'Oswald', sans-serif; font-weight:600;
    font-size:clamp(1.9rem, 5vw, 2.6rem); letter-spacing:.01em;
    margin:0; text-wrap:balance;
  }
  .sub{ color:var(--muted); font-size:.9rem; min-height:1.2em; }

  .vehicle-tabs{ display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:.75rem; }
  .vehicle-tab{
    font-family:'IBM Plex Mono', monospace; font-size:.78rem; letter-spacing:.03em;
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    padding:.5rem 1rem; border-radius:999px; cursor:pointer;
  }
  .vehicle-tab:hover{ color:var(--text); border-color:var(--accent); }
  .vehicle-tab.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .add-vehicle-btn{
    font-family:'IBM Plex Mono', monospace; font-size:.78rem; letter-spacing:.03em;
    background:transparent; border:1px dashed var(--line); color:var(--muted);
    padding:.5rem 1rem; border-radius:999px; cursor:pointer; margin-bottom:1rem;
  }
  .add-vehicle-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .add-vehicle-form{
    display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.5rem;
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:.75rem;
  }
  .add-vehicle-form input{
    flex:1; min-width:140px; background:var(--panel); color:var(--text);
    border:1px solid var(--line); border-radius:5px; padding:.5rem .65rem;
    font-family:inherit; font-size:.88rem;
  }

  .empty-state{ color:var(--muted); font-size:.95rem; padding:2rem 0; text-align:center; }

  .vehicle-panel-header{
    display:flex; flex-wrap:wrap; align-items:center; gap:.75rem;
    margin-bottom:1.25rem; padding-bottom:1rem; border-bottom:1px solid var(--line);
  }
  .v-name{
    font-family:'Oswald', sans-serif; font-weight:600; font-size:1.4rem;
    cursor:text; outline-offset:3px; border-radius:2px;
  }
  .v-name:hover{ outline:1px dashed var(--muted); }
  .v-type{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); background:var(--panel);
    border:1px solid var(--line); border-radius:999px; padding:.25rem .6rem;
  }
  .v-last{ font-size:.85rem; color:var(--muted); margin-left:auto; }
  .icon-btn{
    background:transparent; border:none; color:var(--muted); cursor:pointer;
    font-size:1rem; line-height:1; padding:.2rem .4rem; font-family:inherit;
  }
  .icon-btn:hover{ color:var(--danger); }

  .v-info{ margin-bottom:1.75rem; }
  .v-info h3, .v-col h3{
    font-family:'Oswald', sans-serif; font-weight:500; font-size:1rem;
    letter-spacing:.02em; text-transform:uppercase; margin:0 0 .75rem;
  }
  .info-fields{ display:flex; flex-direction:column; gap:.4rem; margin-bottom:.6rem; }
  .info-row{
    display:flex; align-items:center; gap:.6rem; background:var(--panel);
    border:1px solid var(--line); border-radius:6px; padding:.5rem .75rem;
  }
  .info-label{
    font-family:'IBM Plex Mono', monospace; font-size:.76rem; color:var(--muted);
    min-width:90px; text-transform:uppercase; letter-spacing:.04em;
  }
  .info-value{ flex:1; font-size:.92rem; cursor:text; border-radius:2px; }
  .info-value:hover{ outline:1px dashed var(--muted); outline-offset:2px; }
  .ph{ color:var(--muted); font-style:italic; }
  .delete-info{ font-size:.85rem; }

  .add-info-form, .add-check-form, .add-log-form{
    display:flex; gap:.5rem; flex-wrap:wrap; align-items:center;
    background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:.55rem .7rem;
  }
  .add-info-form input, .add-check-form input, .add-log-form input{
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:5px; padding:.5rem .65rem; font-family:inherit; font-size:.85rem;
  }
  .add-info-form .info-label-input{ width:130px; }
  .add-info-form .info-value-input{ flex:1; min-width:100px; }
  .add-check-form .check-input{ flex:1; min-width:140px; }
  .add-log-form .log-date-input{ width:135px; }
  .add-log-form .log-desc-input{ flex:1; min-width:160px; }
  .add-log-form .log-provider-input{ width:130px; }
  .add-log-form .log-cost-input{ width:100px; }
  .btn-ghost{
    font-family:'IBM Plex Mono', monospace; font-size:.74rem; letter-spacing:.05em;
    text-transform:uppercase; background:transparent; border:1px solid var(--line);
    color:var(--muted); padding:.5rem .8rem; border-radius:5px; cursor:pointer;
  }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }

  .vehicle-photos{ display:flex; flex-wrap:wrap; gap:.6rem; margin:.75rem 0; }
  .vehicle-photos:empty{ margin:0; }
  .photo-thumb{
    position:relative; width:76px; height:76px; border-radius:6px; overflow:hidden;
    border:1px solid var(--line); cursor:zoom-in; background:var(--panel);
  }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-remove, .att-remove{
    position:absolute; top:2px; right:2px; width:1.1rem; height:1.1rem; border-radius:50%;
    background:var(--ink); color:var(--text); border:none; font-size:.65rem; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .photo-actions{ display:flex; }

  .v-body{ display:flex; flex-direction:column; gap:2rem; }
  @media (min-width:760px){ .v-body{ flex-direction:row; } .v-col{ flex:1; min-width:0; } }

  .checklist{ list-style:none; margin:0 0 .75rem; padding:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel); }
  .check-item{ padding:.7rem .9rem; border-bottom:1px solid var(--line); }
  .check-item:last-child{ border-bottom:none; }
  .check-item label{ display:flex; align-items:flex-start; gap:.75rem; cursor:pointer; }
  .check-item input[type="checkbox"]{
    appearance:none; -webkit-appearance:none; width:1.15rem; height:1.15rem; min-width:1.15rem;
    margin-top:.15rem; border:1.5px solid var(--muted); border-radius:4px; background:transparent;
    cursor:pointer; position:relative;
  }
  .check-item input[type="checkbox"]:checked{ background:var(--ok); border-color:var(--ok); }
  .check-item input[type="checkbox"]:checked::after{
    content:""; position:absolute; left:4px; top:1px; width:4px; height:8px;
    border:solid var(--panel); border-width:0 2px 2px 0; transform:rotate(40deg);
  }
  .check-item span{ font-size:.92rem; line-height:1.45; }
  .check-item.checked span{ color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line); }
  .check-tools{ display:flex; gap:.3rem; align-items:center; margin-top:.4rem; margin-left:1.9rem; }
  .check-tools button{
    background:transparent; border:none; color:var(--muted); padding:.15rem .3rem;
    cursor:pointer; font-family:inherit; line-height:1; display:flex; align-items:center;
  }
  .check-tools button:hover{ color:var(--accent); }
  .check-tools svg{ width:1rem; height:1rem; }
  .log-attachments{ display:flex; flex-wrap:wrap; gap:.5rem; margin:.5rem 0 0 1.9rem; }
  .log-attachments:empty{ margin:0; }
  .col-actions{ display:flex; justify-content:flex-end; margin-bottom:.75rem; }

  .log-list{ list-style:none; margin:0 0 .75rem; padding:0; display:flex; flex-direction:column; gap:.6rem; }
  .log-entry{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:.75rem .9rem; }
  .log-row{ display:flex; gap:.75rem; align-items:flex-start; }
  .log-date{ font-family:'IBM Plex Mono', monospace; font-size:.74rem; color:var(--muted); white-space:nowrap; margin-top:.15rem; }
  .log-fields{ flex:1; min-width:0; }
  .log-desc{ display:block; font-size:.92rem; line-height:1.45; cursor:text; border-radius:2px; }
  .log-desc:hover{ outline:1px dashed var(--muted); outline-offset:2px; }
  .log-meta{ display:flex; gap:.75rem; margin-top:.35rem; flex-wrap:wrap; }
  .log-provider, .log-cost{
    font-family:'IBM Plex Mono', monospace; font-size:.76rem; color:var(--muted);
    cursor:text; border-radius:2px;
  }
  .log-cost{ color:var(--accent); }
  .log-provider:hover, .log-cost:hover{ outline:1px dashed var(--muted); outline-offset:2px; }
  .log-tools{ display:flex; gap:.3rem; align-items:center; }
  .log-tools button{
    background:transparent; border:none; color:var(--muted); padding:.15rem .3rem;
    cursor:pointer; font-family:inherit; line-height:1; display:flex; align-items:center;
  }
  .log-tools button:hover{ color:var(--accent); }
  .log-tools svg{ width:1rem; height:1rem; }

  .file-chip{
    display:flex; align-items:center; gap:.4rem; background:var(--panel-2);
    border:1px solid var(--line); border-radius:6px; padding:.35rem .5rem .35rem .7rem;
    font-size:.8rem; position:relative; padding-right:1.6rem;
  }
  .file-chip-link{ color:var(--text); text-decoration:none; }
  .file-chip-link:hover{ color:var(--accent); }
  .file-chip .att-remove{ position:static; margin-left:.2rem; }

  .inline-edit-input{
    background:var(--panel-2); color:var(--text); border:1px solid var(--accent);
    border-radius:4px; padding:.2rem .4rem; font-family:inherit; font-size:inherit; width:100%;
  }

  #lightbox{
    display:none; position:fixed; inset:0; background:rgba(6,14,17,0.86);
    z-index:50; align-items:center; justify-content:center; padding:2rem; cursor:zoom-out;
  }
  #lightbox.open{ display:flex; }
  #lightbox img{ max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 12px 40px rgba(0,0,0,.4); }

  button:focus-visible, input:focus-visible, a:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>

  </header>

  <nav id="vehicleTabs" class="vehicle-tabs"></nav>
  <button id="addVehicleBtn" class="add-vehicle-btn" type="button">+ Agregar vehículo</button>
  <form id="addVehicleForm" class="add-vehicle-form" hidden>
    <input id="newVehicleName" type="text" placeholder="Nombre (ej. Lancha)" required>
    <input id="newVehicleType" type="text" placeholder="Tipo (ej. Auto, Moto)">
    <button class="btn-ghost" type="submit">Crear</button>
  </form>

  <div id="vehiclePanels"></div>
</div>

<div id="lightbox"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient('https://jfivdvkhifqhirrqhcfl.supabase.co', 'sb_publishable_dRuee0FIALTamxZaS1x4gg_jdPdRR6x');

const ATTACH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 12.5l6.5-6.5a3 3 0 1 1 4.24 4.24L10.5 18.5a5 5 0 1 1-7.07-7.07L12 3"/></svg>';
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

let state = { vehicles: [], activeId: null };

const statusLine = document.getElementById('statusLine');
const tabsEl = document.getElementById('vehicleTabs');
const panelsEl = document.getElementById('vehiclePanels');
const lightbox = document.getElementById('lightbox');

function setStatus(msg){ statusLine.textContent = msg; }

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  return `${d} ${MESES[(m||1)-1]} ${y}`;
}

function fmtCost(value){
  const n = typeof value === 'number' ? value : parseFloat(value);
  if(isNaN(n)) return '';
  try{ return new Intl.NumberFormat('es-MX', { style:'currency', currency:'MXN' }).format(n); }
  catch(e){ return '$' + n.toFixed(2); }
}

// --- data loading ----------------------------------------------------
async function loadAll(){
  setStatus('Actualizando…');
  try{
    const { data: vehicles, error: ve } = await supabase.from('vehicles').select('*').order('sort_order');
    if(ve) throw ve;
    const ids = (vehicles || []).map(v => v.id);
    const empty = { data: [] };
    const [infoR, photosR, pendR, histR] = ids.length ? await Promise.all([
      supabase.from('vehicle_info').select('*').in('vehicle_id', ids).order('sort_order'),
      supabase.from('vehicle_photos').select('*').in('vehicle_id', ids).order('created_at'),
      supabase.from('pendientes').select('*').in('vehicle_id', ids).order('sort_order'),
      supabase.from('historial').select('*').in('vehicle_id', ids).order('service_date', { ascending: false }),
    ]) : [empty, empty, empty, empty];

    const pend = pendR.data || [];
    const hist = histR.data || [];
    const pendIds = pend.map(p => p.id);
    const histIds = hist.map(h => h.id);
    const [pendAttR, histAttR] = await Promise.all([
      pendIds.length ? supabase.from('pendiente_attachments').select('*').in('pendiente_id', pendIds) : Promise.resolve(empty),
      histIds.length ? supabase.from('historial_attachments').select('*').in('historial_id', histIds) : Promise.resolve(empty),
    ]);
    const info = infoR.data || [];
    const photos = photosR.data || [];
    const pendAtt = pendAttR.data || [];
    const histAtt = histAttR.data || [];

    state.vehicles = (vehicles || []).map(v => ({
      ...v,
      info: info.filter(i => i.vehicle_id === v.id),
      photos: photos.filter(p => p.vehicle_id === v.id),
      pendientes: pend.filter(p => p.vehicle_id === v.id).map(p => ({ ...p, attachments: pendAtt.filter(a => a.pendiente_id === p.id) })),
      historial: hist.filter(h => h.vehicle_id === v.id).map(h => ({ ...h, attachments: histAtt.filter(a => a.historial_id === h.id) })),
    }));
    if(!state.activeId || !state.vehicles.some(v => v.id === state.activeId)){
      state.activeId = state.vehicles[0]?.id || null;
    }
    setStatus('');
    render();
  }catch(err){
    console.error(err);
    setStatus('No se pudo cargar la información. Revisa tu conexión.');
  }
}

// --- rendering ---------------------------------------------------------
function render(){ renderTabs(); renderPanels(); }

function renderTabs(){
  tabsEl.innerHTML = state.vehicles.map(v => `
    <button type="button" class="vehicle-tab${v.id === state.activeId ? ' active' : ''}" data-vid="${v.id}">${esc(v.name)}</button>
  `).join('');
}

function renderAttachment(a, ownerKind){
  const delBtn = `<button type="button" class="att-remove" data-att-id="${a.id}" data-owner-kind="${ownerKind}" title="Eliminar">✕</button>`;
  if(a.kind === 'image'){
    return `<div class="photo-thumb"><img src="${a.url}" data-full="${a.url}">${delBtn}</div>`;
  }
  return `<div class="file-chip"><a class="file-chip-link" href="${a.url}" target="_blank" rel="noopener">${esc(a.name || 'archivo.pdf')}</a>${delBtn}</div>`;
}

function renderPendiente(p){
  return `
  <li class="check-item${p.checked ? ' checked' : ''}" data-pend-id="${p.id}">
    <label>
      <input type="checkbox" ${p.checked ? 'checked' : ''}>
      <span>${esc(p.text)}</span>
    </label>
    <div class="check-tools">
      <button type="button" class="log-attach-btn" data-kind="pend" data-id="${p.id}" title="Adjuntar foto o PDF">${ATTACH_SVG}</button>
      <input type="file" accept="image/*,.pdf" class="log-attach-input" data-kind="pend" data-id="${p.id}" hidden>
      <button type="button" class="delete-check" title="Eliminar">✕</button>
    </div>
    <div class="log-attachments">${p.attachments.map(a => renderAttachment(a, 'pend')).join('')}</div>
  </li>`;
}

function renderHistorial(h){
  return `
  <li class="log-entry" data-hist-id="${h.id}">
    <div class="log-row">
      <span class="log-date">${fmtDate(h.service_date)}</span>
      <div class="log-fields">
        <span class="log-desc" data-action="edit-hist-desc" data-hist-id="${h.id}">${esc(h.description)}</span>
        <div class="log-meta">
          <span class="log-provider" data-action="edit-hist-provider" data-hist-id="${h.id}">${h.provider ? esc(h.provider) : '<span class="ph">+ proveedor</span>'}</span>
          <span class="log-cost" data-action="edit-hist-cost" data-hist-id="${h.id}">${h.cost != null ? esc(fmtCost(h.cost)) : '<span class="ph">+ costo</span>'}</span>
        </div>
      </div>
      <div class="log-tools">
        <button type="button" class="log-attach-btn" data-kind="hist" data-id="${h.id}" title="Adjuntar foto o PDF">${ATTACH_SVG}</button>
        <input type="file" accept="image/*,.pdf" class="log-attach-input" data-kind="hist" data-id="${h.id}" hidden>
        <button type="button" class="delete-log" title="Eliminar">✕</button>
      </div>
    </div>
    <div class="log-attachments">${h.attachments.map(a => renderAttachment(a, 'hist')).join('')}</div>
  </li>`;
}

function renderPanels(){
  const v = state.vehicles.find(x => x.id === state.activeId);
  if(!v){
    panelsEl.innerHTML = '<p class="empty-state">Agrega tu primer vehículo para empezar.</p>';
    return;
  }
  const lastService = v.historial.length ? v.historial[0].service_date : null;
  panelsEl.innerHTML = `
    <div class="vehicle-panel-header">
      <span class="v-name" data-action="edit-vehicle-name" data-vid="${v.id}" title="Click para renombrar">${esc(v.name)}</span>
      ${v.type ? `<span class="v-type">${esc(v.type)}</span>` : ''}
      ${lastService ? `<span class="v-last">Último servicio: ${fmtDate(lastService)}</span>` : '<span class="v-last"></span>'}
      <button type="button" class="icon-btn delete-vehicle" data-vid="${v.id}" title="Eliminar vehículo">✕</button>
    </div>

    <div class="v-info">
      <h3>Información general</h3>
      <div class="info-fields">
        ${v.info.map(row => `
          <div class="info-row">
            <span class="info-label">${esc(row.label)}</span>
            <span class="info-value" data-action="edit-info-value" data-info-id="${row.id}">${row.value ? esc(row.value) : '<span class="ph">—</span>'}</span>
            <button type="button" class="icon-btn delete-info" data-info-id="${row.id}" title="Eliminar">✕</button>
          </div>`).join('')}
      </div>
      <form class="add-info-form" data-vid="${v.id}">
        <input class="info-label-input" type="text" placeholder="Campo (ej. Placas)" required>
        <input class="info-value-input" type="text" placeholder="Valor">
        <button class="btn-ghost" type="submit">Añadir</button>
      </form>
      <div class="vehicle-photos">
        ${v.photos.map(p => `<div class="photo-thumb" data-photo-id="${p.id}"><img src="${p.url}" data-full="${p.url}"><button type="button" class="photo-remove" data-photo-id="${p.id}" title="Eliminar">✕</button></div>`).join('')}
      </div>
      <div class="photo-actions">
        <button type="button" class="btn-ghost add-vehicle-photo" data-vid="${v.id}">+ Agregar foto</button>
        <input type="file" accept="image/*" class="vehicle-photo-input" data-vid="${v.id}" hidden>
      </div>
    </div>

    <div class="v-body">
      <div class="v-col">
        <h3>Pendientes</h3>
        <ul class="checklist">${v.pendientes.map(renderPendiente).join('')}</ul>
        <form class="add-check-form" data-vid="${v.id}">
          <input class="check-input" type="text" placeholder="Nuevo punto del checklist" required>
          <button class="btn-ghost" type="submit">Añadir</button>
        </form>
        <div class="col-actions"><button type="button" class="btn-ghost reset-checklist" data-vid="${v.id}">Reiniciar checklist</button></div>
      </div>

      <div class="v-col">
        <h3>Historial de mantenimiento</h3>
        <ul class="log-list">${v.historial.map(renderHistorial).join('')}</ul>
        <form class="add-log-form" data-vid="${v.id}">
          <input class="log-date-input" type="date" required>
          <input class="log-desc-input" type="text" placeholder="¿Qué se hizo?" required>
          <input class="log-provider-input" type="text" placeholder="Proveedor">
          <input class="log-cost-input" type="text" inputmode="decimal" placeholder="Costo">
          <button class="btn-ghost" type="submit">Añadir</button>
        </form>
      </div>
    </div>
  `;
}

// --- lightbox ------------------------------------------------------
function openLightboxImage(src){
  lightbox.innerHTML = `<img src="${src}" alt="Foto">`;
  lightbox.classList.add('open');
}
function closeLightbox(){ lightbox.classList.remove('open'); lightbox.innerHTML = ''; }

// --- attachments / storage -----------------------------------------
function fileToDataUrl(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function loadImageEl(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
async function compressImage(file, maxDim = 1600, quality = 0.82){
  const dataUrl = await fileToDataUrl(file);
  const img = await loadImageEl(dataUrl);
  let { width: w, height: h } = img;
  if(w > maxDim || h > maxDim){
    const scale = maxDim / Math.max(w, h);
    w = Math.round(w * scale); h = Math.round(h * scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
}

async function uploadAttachment(file, folder){
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf';
  if(!isImage && !isPdf){ alert('Solo se aceptan imágenes o PDF'); return null; }
  let blob = file, ext = 'pdf', contentType = 'application/pdf';
  if(isImage){
    blob = await compressImage(file);
    ext = 'jpg'; contentType = 'image/jpeg';
  }
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await supabase.storage.from('bitacora').upload(path, blob, { contentType, upsert: false });
  if(error){ console.error(error); alert('No se pudo subir el archivo'); return null; }
  const { data } = supabase.storage.from('bitacora').getPublicUrl(path);
  return { url: data.publicUrl, kind: isImage ? 'image' : 'pdf', name: file.name };
}

// --- inline edit -----------------------------------------------------
function findHistorial(id){
  for(const v of state.vehicles){ const h = v.historial.find(x => x.id === id); if(h) return h; }
  return null;
}
function findInfoRow(id){
  for(const v of state.vehicles){ const i = v.info.find(x => x.id === id); if(i) return i; }
  return null;
}
function findVehicle(id){ return state.vehicles.find(v => v.id === id); }

function handleEditableSpan(el){
  if(el.querySelector('input')) return;
  const action = el.dataset.action;
  let value = '', onSave = null;

  if(action === 'edit-vehicle-name'){
    const vid = el.dataset.vid; const v = findVehicle(vid);
    value = v.name;
    onSave = async val => { if(val) await supabase.from('vehicles').update({ name: val }).eq('id', vid); };
  } else if(action === 'edit-info-value'){
    const id = el.dataset.infoId; const row = findInfoRow(id);
    value = row.value;
    onSave = async val => { await supabase.from('vehicle_info').update({ value: val }).eq('id', id); };
  } else if(action === 'edit-hist-desc'){
    const id = el.dataset.histId; const h = findHistorial(id);
    value = h.description;
    onSave = async val => { if(val) await supabase.from('historial').update({ description: val }).eq('id', id); };
  } else if(action === 'edit-hist-provider'){
    const id = el.dataset.histId; const h = findHistorial(id);
    value = h.provider;
    onSave = async val => { await supabase.from('historial').update({ provider: val }).eq('id', id); };
  } else if(action === 'edit-hist-cost'){
    const id = el.dataset.histId; const h = findHistorial(id);
    value = h.cost != null ? String(h.cost) : '';
    onSave = async val => {
      const num = val === '' ? null : parseFloat(val.replace(/[^0-9.]/g, ''));
      await supabase.from('historial').update({ cost: (num == null || isNaN(num)) ? null : num }).eq('id', id);
    };
  } else return;

  const input = document.createElement('input');
  input.type = 'text';
  input.value = value || '';
  input.className = 'inline-edit-input';
  el.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = async commit => {
    if(done) return; done = true;
    if(commit) await onSave(input.value.trim());
    loadAll();
  };
  input.addEventListener('keydown', ev => {
    if(ev.key === 'Enter'){ ev.preventDefault(); finish(true); }
    else if(ev.key === 'Escape'){ ev.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

// --- events ------------------------------------------------------------
document.addEventListener('click', async e => {
  if(e.target === lightbox){ closeLightbox(); return; }
  const thumbImg = e.target.closest('.photo-thumb') && e.target.tagName === 'IMG' ? e.target : null;
  if(thumbImg){ openLightboxImage(thumbImg.dataset.full || thumbImg.src); return; }

  const tab = e.target.closest('.vehicle-tab');
  if(tab){ state.activeId = tab.dataset.vid; render(); return; }

  if(e.target.id === 'addVehicleBtn'){
    const form = document.getElementById('addVehicleForm');
    form.hidden = !form.hidden;
    if(!form.hidden) document.getElementById('newVehicleName').focus();
    return;
  }

  const editTarget = e.target.closest('[data-action]');
  if(editTarget && editTarget.tagName === 'SPAN'){ handleEditableSpan(editTarget); return; }

  const delVehicle = e.target.closest('.delete-vehicle');
  if(delVehicle){
    if(!confirm('¿Eliminar este vehículo y todo su historial? No se puede deshacer.')) return;
    await supabase.from('vehicles').delete().eq('id', delVehicle.dataset.vid);
    state.activeId = null;
    loadAll();
    return;
  }

  const delInfo = e.target.closest('.delete-info');
  if(delInfo){ await supabase.from('vehicle_info').delete().eq('id', delInfo.dataset.infoId); loadAll(); return; }

  const addPhotoBtn = e.target.closest('.add-vehicle-photo');
  if(addPhotoBtn){ addPhotoBtn.parentElement.querySelector('.vehicle-photo-input').click(); return; }

  const rmPhoto = e.target.closest('.photo-remove');
  if(rmPhoto){
    await supabase.from('vehicle_photos').delete().eq('id', rmPhoto.dataset.photoId);
    loadAll();
    return;
  }

  const attRemove = e.target.closest('.att-remove');
  if(attRemove){
    const id = attRemove.dataset.attId;
    const ownerKind = attRemove.dataset.ownerKind;
    if(ownerKind === 'pend') await supabase.from('pendiente_attachments').delete().eq('id', id);
    else await supabase.from('historial_attachments').delete().eq('id', id);
    loadAll();
    return;
  }

  const attachBtn = e.target.closest('.log-attach-btn');
  if(attachBtn){ attachBtn.parentElement.querySelector('.log-attach-input').click(); return; }

  const delCheck = e.target.closest('.delete-check');
  if(delCheck){
    const id = delCheck.closest('.check-item').dataset.pendId;
    await supabase.from('pendientes').delete().eq('id', id);
    loadAll();
    return;
  }

  const resetBtn = e.target.closest('.reset-checklist');
  if(resetBtn){
    await supabase.from('pendientes').update({ checked: false }).eq('vehicle_id', resetBtn.dataset.vid);
    loadAll();
    return;
  }

  const delLog = e.target.closest('.delete-log');
  if(delLog){
    const id = delLog.closest('.log-entry').dataset.histId;
    await supabase.from('historial').delete().eq('id', id);
    loadAll();
    return;
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if(t.classList.contains('vehicle-photo-input')){
    const file = t.files[0]; if(!file) return;
    const vid = t.dataset.vid;
    const att = await uploadAttachment(file, `vehicle-photos/${vid}`);
    t.value = '';
    if(!att) return;
    await supabase.from('vehicle_photos').insert({ vehicle_id: vid, url: att.url });
    loadAll();
    return;
  }
  if(t.classList.contains('log-attach-input')){
    const file = t.files[0]; if(!file) return;
    const kind = t.dataset.kind, id = t.dataset.id;
    const att = await uploadAttachment(file, `${kind}-attachments/${id}`);
    t.value = '';
    if(!att) return;
    if(kind === 'pend') await supabase.from('pendiente_attachments').insert({ pendiente_id: id, kind: att.kind, url: att.url, name: att.name });
    else await supabase.from('historial_attachments').insert({ historial_id: id, kind: att.kind, url: att.url, name: att.name });
    loadAll();
    return;
  }
  if(t.matches('.check-item input[type="checkbox"]')){
    const id = t.closest('.check-item').dataset.pendId;
    await supabase.from('pendientes').update({ checked: t.checked }).eq('id', id);
    loadAll();
    return;
  }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target;

  if(form.id === 'addVehicleForm'){
    const name = document.getElementById('newVehicleName').value.trim();
    const type = document.getElementById('newVehicleType').value.trim();
    if(!name) return;
    const { data, error } = await supabase.from('vehicles').insert({ name, type, sort_order: state.vehicles.length }).select().single();
    form.reset(); form.hidden = true;
    if(error){ alert('No se pudo crear el vehículo'); return; }
    state.activeId = data.id;
    loadAll();
    return;
  }

  if(form.classList.contains('add-info-form')){
    const vid = form.dataset.vid;
    const label = form.querySelector('.info-label-input').value.trim();
    const value = form.querySelector('.info-value-input').value.trim();
    if(!label) return;
    const v = findVehicle(vid);
    await supabase.from('vehicle_info').insert({ vehicle_id: vid, label, value, sort_order: v ? v.info.length : 0 });
    form.reset();
    loadAll();
    return;
  }

  if(form.classList.contains('add-check-form')){
    const vid = form.dataset.vid;
    const input = form.querySelector('.check-input');
    const text = input.value.trim();
    if(!text) return;
    const v = findVehicle(vid);
    await supabase.from('pendientes').insert({ vehicle_id: vid, text, checked: false, sort_order: v ? v.pendientes.length : 0 });
    input.value = '';
    loadAll();
    return;
  }

  if(form.classList.contains('add-log-form')){
    const vid = form.dataset.vid;
    const date = form.querySelector('.log-date-input').value;
    const desc = form.querySelector('.log-desc-input').value.trim();
    const provider = form.querySelector('.log-provider-input').value.trim();
    const costRaw = form.querySelector('.log-cost-input').value.trim();
    if(!date || !desc) return;
    const cost = costRaw === '' ? null : parseFloat(costRaw.replace(/[^0-9.]/g, ''));
    await supabase.from('historial').insert({ vehicle_id: vid, service_date: date, description: desc, provider, cost: isNaN(cost) ? null : cost });
    form.reset();
    loadAll();
    return;
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
});

// --- realtime: any change from any device reloads this view -----------
function subscribeRealtime(){
  const tables = ['vehicles', 'vehicle_info', 'vehicle_photos', 'pendientes', 'pendiente_attachments', 'historial', 'historial_attachments'];
  const channel = supabase.channel('bitacora-changes');
  tables.forEach(t => {
    channel.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => scheduleReload());
  });
  channel.subscribe();
}
let reloadTimer = null;
function scheduleReload(){ clearTimeout(reloadTimer); reloadTimer = setTimeout(loadAll, 400); }

loadAll();
subscribeRealtime();
</script>
