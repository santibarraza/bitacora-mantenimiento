<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácora de Mantenimiento</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#11242b">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bitácora">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Bebas+Neue&display=swap');

  :root{
    --ink:#0c1c22;
    --panel:#17313a;
    --panel-2:#1c3b45;
    --text:#eef3f1;
    --muted:#93a8ae;
    --line:rgba(238,243,241,0.09);
    --accent:#ff9700;
    --accent-ink:#11242b;
    --ok:#4fa97a;
    --bg:#11242b;
    --danger:#e2543e;
  }
  :root[data-theme="light"]{
    --ink:#20302f; --panel:#fbf7ec; --panel-2:#f3ecd9; --text:#1c2b2a;
    --muted:#5e6e6a; --line:rgba(28,43,42,0.12); --accent:#c2680a;
    --accent-ink:#fff6e8; --ok:#2f6e4c; --bg:#f1ead9; --danger:#a9382a;
  }
  :root[data-theme="dark"]{
    --ink:#0c1c22; --panel:#17313a; --panel-2:#1c3b45; --text:#eef3f1;
    --muted:#93a8ae; --line:rgba(238,243,241,0.09); --accent:#ff9700;
    --accent-ink:#11242b; --ok:#4fa97a; --bg:#11242b; --danger:#e2543e;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Roboto', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:2.5rem 1.25rem 5rem;
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  .page{max-width:920px; margin:0 auto;}

  header.top{
    display:flex; flex-direction:column; gap:.4rem;
    padding-bottom:1.5rem; margin-bottom:1.5rem;
    border-bottom:1px solid var(--line);
  }
  .brand-logo{ display:block; height:44px; width:auto; margin-bottom:.4rem; border-radius:6px; align-self:flex-start; }
  .eyebrow{
    font-family:'Roboto', sans-serif; font-size:.72rem;
    letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
  }
  h1{
    font-family:'Bebas Neue', sans-serif; font-weight:600;
    font-size:clamp(1.9rem, 5vw, 2.6rem); letter-spacing:.01em;
    margin:0; text-wrap:balance;
  }
  .sub{ color:var(--muted); font-size:.9rem; min-height:1.2em; }

  .global-reminders{ margin-bottom:1.25rem; }
  .global-reminders:empty{ margin:0; }
  .global-reminders-summary{
    font-family:'Roboto', sans-serif; font-size:.82rem; letter-spacing:.03em;
    color:var(--danger); margin-bottom:.5rem;
  }
  .global-reminders-list{ display:flex; flex-wrap:wrap; gap:.5rem; }
  .global-reminder-pill{
    font-family:'Roboto', sans-serif; font-size:.74rem; letter-spacing:.02em;
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:.4rem .85rem; cursor:pointer; text-align:left;
  }
  .global-reminder-pill:hover{ border-color:var(--accent); color:var(--text); }
  .global-reminder-pill.reminder-overdue{ border-color:var(--danger); color:var(--danger); }
  .global-reminder-pill.reminder-soon{ border-color:var(--accent); color:var(--accent); }

  .add-vehicle-btn{
    font-family:'Roboto', sans-serif; font-size:1rem; line-height:1;
    background:transparent; border:1px dashed var(--line); color:var(--muted);
    width:2.1rem; height:2.1rem; min-width:2.1rem; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .add-vehicle-btn:hover{ border-color:var(--accent); color:var(--accent); }

  .global-view-tab{
    font-family:'Roboto', sans-serif; font-size:.74rem; letter-spacing:.03em;
    background:transparent; border:1px solid var(--line); color:var(--muted);
    padding:.4rem .85rem; border-radius:999px; cursor:pointer;
  }
  .global-view-tab:hover{ color:var(--text); border-color:var(--accent); }
  .global-view-tab.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .home-tab{ font-weight:600; }
  .back-home-btn{ margin-bottom:1.25rem; }

  .home-section-header{ display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin-bottom:.75rem; }
  .home-section-header .home-section-title{ margin:0; }

  .home-section{ margin-bottom:2rem; }
  .home-section:last-child{ margin-bottom:0; }
  .home-section-title{
    font-family:'Roboto', sans-serif; font-size:.72rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); margin:0 0 .75rem;
  }

  .home-general-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:.7rem; }
  .home-nav-card{
    display:flex; flex-direction:column; gap:.35rem; text-align:left;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:.9rem 1rem; cursor:pointer; font-family:inherit; color:inherit;
  }
  .home-nav-card:hover{ border-color:var(--accent); }
  .home-nav-card-icon{ font-size:1.3rem; line-height:1; }
  .home-nav-card-title{ font-family:'Bebas Neue', sans-serif; font-weight:600; font-size:.98rem; }
  .home-nav-card-stat{ font-size:.78rem; color:var(--muted); }
  .home-nav-card-primary{ border-color:var(--accent); background:var(--panel-2); }
  .home-nav-card-primary .home-nav-card-title{ color:var(--accent); }

  /* --- Lock screen (contraseña compartida) --- */
  .lock-screen{
    position:fixed; inset:0; background:var(--bg); display:flex;
    align-items:center; justify-content:center; padding:1.5rem; z-index:999;
  }
  .lock-screen[hidden]{ display:none; }
  .lock-card{
    width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:1.75rem 1.5rem; text-align:center;
  }
  .lock-card h2{ margin:.4rem 0 .3rem; font-family:'Bebas Neue', sans-serif; letter-spacing:.03em; }
  .lock-sub{ color:var(--muted); font-size:.85rem; margin:0 0 1.1rem; }
  #lockForm{ display:flex; flex-direction:column; gap:.6rem; }
  #lockForm input{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:.6rem .75rem; font-family:inherit; font-size:.95rem; text-align:center;
  }
  #lockForm button{ margin-top:.2rem; }
  .lock-error{ color:var(--danger); font-size:.8rem; margin:.8rem 0 0; }

  /* --- Ajustes --- */
  .ajustes-section{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:1rem 1.1rem; margin-bottom:1rem;
  }
  .ajustes-section h3{
    margin:0 0 .3rem; font-family:'Bebas Neue', sans-serif; letter-spacing:.03em; font-size:1.05rem;
  }
  .ajustes-desc{ color:var(--muted); font-size:.82rem; line-height:1.5; margin:0 0 .8rem; }
  .ajustes-status{
    display:inline-flex; align-items:center; gap:.4rem; font-size:.8rem; color:var(--muted);
    margin-bottom:.7rem;
  }
  .ajustes-status.on{ color:var(--ok); }
  .ajustes-row{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  .ajustes-row-gap{ margin-top:.6rem; }
  .ajustes-row input{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:5px; padding:.5rem .65rem; font-family:inherit; font-size:.85rem; flex:1; min-width:160px;
  }

  /* --- Consumo de combustible --- */
  .fuel-list{ display:flex; flex-direction:column; gap:.4rem; margin-bottom:.6rem; }
  .fuel-row{
    display:flex; align-items:center; gap:.7rem; background:var(--panel);
    border:1px solid var(--line); border-radius:6px; padding:.5rem .75rem; flex-wrap:wrap; font-size:.82rem;
  }
  .fuel-date{ color:var(--muted); white-space:nowrap; }
  .fuel-rate{ color:var(--accent); font-weight:600; margin-left:auto; }
  .fuel-partial{ color:var(--muted); font-style:italic; }
  .add-fuel-form{
    display:flex; gap:.5rem; flex-wrap:wrap; align-items:center;
    background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:.55rem .7rem;
  }
  .add-fuel-form input, .add-fuel-form select{
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:5px; padding:.5rem .6rem; font-family:inherit; font-size:.85rem;
  }
  .add-fuel-form .fuel-odo-input, .add-fuel-form .fuel-volume-input, .add-fuel-form .fuel-cost-input{ width:110px; }
  .add-fuel-form label.fuel-full-label{
    display:flex; align-items:center; gap:.35rem; font-size:.8rem; color:var(--muted); cursor:pointer;
  }

  .home-vehicle-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:.7rem; }
  .home-vehicle-card{
    display:flex; flex-direction:column; gap:.4rem; text-align:left;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:1rem 1.1rem; cursor:pointer; font-family:inherit; color:inherit;
  }
  .home-vehicle-card:hover{ border-color:var(--accent); }
  .home-vehicle-card-top{ display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap; }
  .home-vehicle-name{ font-family:'Bebas Neue', sans-serif; font-weight:600; font-size:1.15rem; }
  .home-vehicle-type{
    font-family:'Roboto', sans-serif; font-size:.68rem; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted);
  }
  .home-vehicle-meta{ display:flex; flex-wrap:wrap; gap:.5rem; font-size:.78rem; color:var(--muted); }
  .home-vehicle-meta .warn{ color:var(--accent); }

  .home-reminders-list{ display:flex; flex-direction:column; gap:.5rem; }
  .home-reminder-row{
    display:block; width:100%; text-align:left; font-family:inherit; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:6px; padding:.6rem .8rem; font-size:.85rem; color:var(--text);
  }
  .home-reminder-row.reminder-overdue{ border-left-color:var(--danger); }
  .home-reminder-row.reminder-soon{ border-left-color:var(--accent); }
  .home-reminder-row:hover{ border-color:var(--accent); }
  .home-reminder-vehicle{ font-weight:600; margin-right:.4rem; }
  .home-reminder-date{ color:var(--muted); margin-left:.4rem; }

  .home-activity-list{ display:flex; flex-direction:column; }
  .home-activity-item{
    display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap;
    padding:.55rem 0; border-bottom:1px solid var(--line); font-size:.85rem;
  }
  .home-activity-item:last-child{ border-bottom:none; }
  .home-activity-vehicle{ font-weight:600; cursor:pointer; }
  .home-activity-vehicle:hover{ color:var(--accent); }
  .home-activity-date{ color:var(--muted); font-family:'Roboto', sans-serif; font-size:.76rem; white-space:nowrap; }
  .home-activity-desc{ flex:1; min-width:140px; }
  .home-activity-cost{ color:var(--accent); font-family:'Roboto', sans-serif; font-size:.8rem; }

  .home-priority-group{ margin-bottom:1rem; }
  .home-priority-group:last-child{ margin-bottom:0; }
  .home-priority-vehicle{
    background:none; border:none; padding:0; margin:0 0 .4rem;
    font-family:'Bebas Neue', sans-serif; font-size:.85rem; letter-spacing:.02em;
    color:var(--text); cursor:pointer; display:inline-block;
  }
  .home-priority-vehicle:hover{ color:var(--accent); }
  .add-vehicle-btn[aria-expanded="true"]{ border-style:solid; color:var(--accent); border-color:var(--accent); }
  .add-vehicle-form{
    display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.5rem;
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:.75rem;
  }
  .add-vehicle-form[hidden]{ display:none; }
  .add-vehicle-form input{
    flex:1; min-width:140px; background:var(--panel); color:var(--text);
    border:1px solid var(--line); border-radius:5px; padding:.5rem .65rem;
    font-family:inherit; font-size:.88rem;
  }

  .empty-state{ color:var(--muted); font-size:.95rem; padding:2rem 0; text-align:center; }

  .vehicle-panel-header{
    display:flex; flex-wrap:wrap; align-items:center; gap:.75rem;
    margin-bottom:1.25rem; padding-bottom:1rem; border-bottom:1px solid var(--line);
  }
  .v-name{
    font-family:'Bebas Neue', sans-serif; font-weight:600; font-size:1.4rem;
    cursor:text; outline-offset:3px; border-radius:2px;
  }
  .v-name:hover{ outline:1px dashed var(--muted); }
  .v-type{
    font-family:'Roboto', sans-serif; font-size:.72rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); background:var(--panel);
    border:1px solid var(--line); border-radius:999px; padding:.25rem .6rem;
  }
  .v-last{ font-size:.85rem; color:var(--muted); margin-left:auto; }
  .v-stats{ display:flex; flex-wrap:wrap; gap:.5rem; margin:-.75rem 0 1.25rem; }
  .stat-chip{
    font-family:'Roboto', sans-serif; font-size:.78rem; color:var(--muted);
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:.35rem .75rem; letter-spacing:.02em;
  }
  .stat-chip strong{ color:var(--accent); font-weight:inherit; }
  .v-odometer{ display:flex; align-items:center; gap:.3rem; }
  .v-odo-value, .v-odo-unit{ cursor:text; border-radius:2px; }
  .v-odo-value:hover, .v-odo-unit:hover{ outline:1px dashed var(--muted); outline-offset:2px; }
  .v-odo-value{ color:var(--accent); }
  .icon-btn{
    background:transparent; border:none; color:var(--muted); cursor:pointer;
    font-size:1rem; line-height:1; padding:.2rem .4rem; font-family:inherit;
  }
  .icon-btn:hover{ color:var(--danger); }
  .icon-btn.export-pdf-btn:hover{ color:var(--accent); }

  .v-info{ margin-bottom:1.75rem; }
  .v-info h3, .v-col h3{
    font-family:'Bebas Neue', sans-serif; font-weight:500; font-size:1rem;
    letter-spacing:.02em; text-transform:uppercase; margin:0 0 .75rem;
  }
  .info-fields{ display:flex; flex-direction:column; gap:.4rem; margin-bottom:.6rem; }
  .info-row{
    display:flex; align-items:center; gap:.6rem; background:var(--panel);
    border:1px solid var(--line); border-radius:6px; padding:.5rem .75rem;
  }
  .info-label{
    font-family:'Roboto', sans-serif; font-size:.76rem; color:var(--muted);
    min-width:90px; text-transform:uppercase; letter-spacing:.04em;
  }
  .info-value{ flex:1; font-size:.92rem; border-radius:2px; }
  .info-value[data-action]{ cursor:text; }
  .info-value[data-action]:hover{ outline:1px dashed var(--muted); outline-offset:2px; }
  .ph{ color:var(--muted); font-style:italic; }
  .delete-info{ font-size:.85rem; }

  .v-info-header{ display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin-bottom:.75rem; }
  .v-info-header h3{ margin:0; }
  .icon-btn.edit-info-toggle{
    font-family:'Roboto', sans-serif; font-size:.7rem; letter-spacing:.05em;
    text-transform:uppercase; border:1px solid var(--line); border-radius:999px; padding:.3rem .7rem;
  }
  .icon-btn.edit-info-toggle:hover{ color:var(--accent); border-color:var(--accent); }
  .icon-btn.edit-info-toggle.active{ color:var(--accent); border-color:var(--accent); }

  .add-info-form, .add-check-form, .add-general-check-form, .add-log-form{
    display:flex; gap:.5rem; flex-wrap:wrap; align-items:center;
    background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:.55rem .7rem;
  }
  .add-info-form input, .add-check-form input, .add-general-check-form input, .add-log-form input,
  .add-log-form select{
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:5px; padding:.5rem .65rem; font-family:inherit; font-size:.85rem;
  }
  .add-info-form .info-label-input{ width:130px; }
  .add-info-form .info-value-input{ flex:1; min-width:100px; }
  .add-check-form .check-input, .add-general-check-form .check-input{ flex:1; min-width:140px; }
  .add-log-form .log-date-input{ width:135px; }
  .add-log-form .log-desc-input{ flex:1; min-width:160px; }
  .add-log-form .log-provider-input{ width:130px; }
  .add-log-form .log-cost-input{ width:100px; }
  .add-log-form .mini-field{ display:flex; flex-direction:column; gap:.2rem; }
  .add-log-form .mini-field span{
    font-family:'Roboto', sans-serif; font-size:.62rem; letter-spacing:.05em;
    text-transform:uppercase; color:var(--muted);
  }
  .add-log-form .log-reminder-input{ width:135px; }
  .add-log-form .log-repeat-select{ width:110px; }
  .add-log-form .log-odometer-input{ width:110px; }
  .btn-ghost{
    font-family:'Roboto', sans-serif; font-size:.74rem; letter-spacing:.05em;
    text-transform:uppercase; background:transparent; border:1px solid var(--line);
    color:var(--muted); padding:.5rem .8rem; border-radius:5px; cursor:pointer;
  }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }

  .vehicle-photos{ display:flex; flex-wrap:wrap; gap:.6rem; margin:.75rem 0; }
  .vehicle-photos:empty{ margin:0; }
  .photo-thumb{
    position:relative; width:76px; height:76px; border-radius:6px; overflow:hidden;
    border:1px solid var(--line); cursor:zoom-in; background:var(--panel);
  }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-remove, .att-remove, .diagram-remove{
    position:absolute; top:2px; right:2px; width:1.1rem; height:1.1rem; border-radius:50%;
    background:var(--ink); color:var(--text); border:none; font-size:.65rem; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .photo-actions{ display:flex; }

  .v-body{ display:flex; flex-direction:column; gap:2rem; }
  @media (min-width:760px){ .v-body{ flex-direction:row; } .v-col{ flex:1; min-width:0; } }

  .checklist{ list-style:none; margin:0 0 .75rem; padding:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel); }
  .all-pend-tab{ border-style:dashed; }
  .all-pend-tab.active{ border-style:solid; }
  .all-pend-groups{ display:flex; flex-direction:column; gap:1.5rem; }
  .all-pend-vehicle{
    font-family:'Bebas Neue', sans-serif; font-weight:500; font-size:1rem;
    letter-spacing:.02em; margin:0 0 .6rem; cursor:pointer; display:inline-block;
  }
  .all-pend-vehicle:hover{ color:var(--accent); }
  .check-item{ padding:.7rem .9rem; border-bottom:1px solid var(--line); }
  .check-item:last-child{ border-bottom:none; }
  .check-item label{ display:flex; align-items:flex-start; gap:.75rem; cursor:pointer; }
  .check-item input[type="checkbox"]{
    appearance:none; -webkit-appearance:none; width:1.15rem; height:1.15rem; min-width:1.15rem;
    margin-top:.15rem; border:1.5px solid var(--muted); border-radius:4px; background:transparent;
    cursor:pointer; position:relative;
  }
  .check-item input[type="checkbox"]:checked{ background:var(--ok); border-color:var(--ok); }
  .check-item input[type="checkbox"]:checked::after{
    content:""; position:absolute; left:4px; top:1px; width:4px; height:8px;
    border:solid var(--panel); border-width:0 2px 2px 0; transform:rotate(40deg);
  }
  .check-item span{ font-size:.92rem; line-height:1.45; }
  .check-item.checked span{ color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line); }
  .check-item.priority-alta{ border-left:3px solid var(--danger); }
  .check-item.priority-media{ border-left:3px solid var(--accent); }
  .check-item.priority-baja{ border-left:3px solid var(--ok); }
  .check-tools{ display:flex; gap:.4rem; align-items:center; margin-top:.4rem; margin-left:1.9rem; flex-wrap:wrap; }
  .check-tools button{
    background:transparent; border:none; color:var(--muted); padding:.15rem .3rem;
    cursor:pointer; font-family:inherit; line-height:1; display:flex; align-items:center;
  }
  .check-tools button:hover{ color:var(--accent); }
  .check-tools svg{ width:1rem; height:1rem; }
  .pend-priority-select{
    font-family:'Roboto', sans-serif; font-size:.68rem; letter-spacing:.04em;
    text-transform:uppercase; background:var(--panel-2); color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:.2rem .55rem; cursor:pointer;
  }
  .pend-priority-select.priority-alta{ color:var(--danger); border-color:var(--danger); }
  .pend-priority-select.priority-media{ color:var(--accent); border-color:var(--accent); }
  .pend-priority-select.priority-baja{ color:var(--ok); border-color:var(--ok); }
  .log-attachments{ display:flex; flex-wrap:wrap; gap:.5rem; margin:.5rem 0 0 1.9rem; }
  .log-attachments:empty{ margin:0; }
  .col-actions{ display:flex; justify-content:flex-end; margin-bottom:.75rem; }

  .provider-list{ display:flex; flex-direction:column; gap:.6rem; margin-bottom:1rem; }

  .provider-row{ display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }

  }

  .parts-store-link{

  .file-chip{

  .inline-edit-input{

  button:focus-visible, input:focus-visible, a:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  if(h.provider) lines.push(`Proveedor: ${h.provider}`);
  if(h.cost != null) lines.push(`Costo: ${fmtCost(h.cost)}`);
  const details = encodeURIComponent(lines.join('\n'));
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${details}`;
}

function addMonths(dateStr, months){
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, (m - 1) + months, d);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
}

function numFmt(n){
  if(n == null || isNaN(n)) return '';
  return new Intl.NumberFormat('es-MX').format(n);
}

function costStats(historial){
  const year = new Date().getFullYear();
  let total = 0, thisYear = 0;
  for(const h of historial){
    if(h.cost == null) continue;
    total += h.cost;
    if(h.service_date && parseInt(h.service_date.slice(0, 4), 10) === year) thisYear += h.cost;
  }
  return { total, thisYear };
}

function collectGlobalReminders(){
  const items = [];
  for(const v of state.vehicles){
    for(const h of v.historial){
      const rem = reminderStatus(h.reminder_date);
      if(rem && (rem.cls === 'reminder-overdue' || rem.cls === 'reminder-soon')){
        items.push({ vehicleId: v.id, vehicleName: v.name, hist: h, rem });
      }
    }
    for(const d of (v.documents || [])){
      const rem = reminderStatus(d.expiry_date);
      if(rem && (rem.cls === 'reminder-overdue' || rem.cls === 'reminder-soon')){
        items.push({ vehicleId: v.id, vehicleName: v.name, hist: { description: `📄 ${d.name}`, reminder_date: d.expiry_date }, rem });
      }
    }
  }
  items.sort((a, b) => (a.hist.reminder_date < b.hist.reminder_date ? -1 : 1));
  return items;
}

function renderGlobalReminders(){
  if(state.activeId === HOME_VIEW){ globalRemindersEl.innerHTML = ''; return; }
  const items = collectGlobalReminders();
  if(!items.length){ globalRemindersEl.innerHTML = ''; return; }
  const overdueCount = items.filter(i => i.rem.cls === 'reminder-overdue').length;
  const soonCount = items.length - overdueCount;
  const parts = [];
  if(overdueCount) parts.push(`${overdueCount} vencido${overdueCount === 1 ? '' : 's'}`);
  if(soonCount) parts.push(`${soonCount} próximo${soonCount === 1 ? '' : 's'}`);
  globalRemindersEl.innerHTML = `
    <div class="global-reminders-summary">⏰ ${esc(parts.join(' · '))}</div>
    <div class="global-reminders-list">
      ${items.map(i => `
        <button type="button" class="global-reminder-pill ${i.rem.cls}" data-vid="${i.vehicleId}" title="Ir a ${esc(i.vehicleName)}">
          ${esc(i.vehicleName)} · ${esc(i.hist.description)} · ${esc(i.rem.label.replace('⏰ ', ''))}
        </button>`).join('')}
    </div>
  `;
}

async function loadAll(){
  setStatus('Actualizando…');
  try{
    const { data: vehicles, error: ve } = await supabase.from('vehicles').select('*').order('sort_order');
    if(ve) throw ve;
    const ids = (vehicles || []).map(v => v.id);
    const empty = { data: [] };
    const [infoR, photosR, pendR, histR, providersR, docsR, diagramsR, generalPendR, techRefR, fuelR, settingsR] = await Promise.all([
      ids.length ? supabase.from('vehicle_info').select('*').in('vehicle_id', ids).order('sort_order') : Promise.resolve(empty),
      ids.length ? supabase.from('vehicle_photos').select('*').in('vehicle_id', ids).order('created_at') : Promise.resolve(empty),
      ids.length ? supabase.from('pendientes').select('*').in('vehicle_id', ids).order('sort_order') : Promise.resolve(empty),
      ids.length ? supabase.from('historial').select('*').in('vehicle_id', ids).order('service_date', { ascending: false }) : Promise.resolve(empty),
      supabase.from('providers').select('*').order('sort_order'),
      ids.length ? supabase.from('vehicle_documents').select('*').in('vehicle_id', ids).order('created_at') : Promise.resolve(empty),
      ids.length ? supabase.from('vehicle_diagrams').select('*').in('vehicle_id', ids).order('created_at') : Promise.resolve(empty),
      supabase.from('general_pendientes').select('*').order('sort_order'),
      supabase.from('tech_reference').select('*').order('sort_order'),
      ids.length ? supabase.from('fuel_log').select('*').in('vehicle_id', ids).order('fill_date') : Promise.resolve(empty),
      supabase.from('app_settings').select('key, value'),
    ]);
    state.providers = providersR.data || [];
    state.generalPendientes = generalPendR.data || [];
    state.techReference = techRefR.data || [];
    const documents = docsR.data || [];
    const diagrams = diagramsR.data || [];
    const fuelLog = fuelR.data || [];
    state.accessPasswordSet = !!(settingsR.data || []).find(s => s.key === 'access_password_hash')?.value;

    const pend = pendR.data || [];
    const hist = histR.data || [];
    const pendIds = pend.map(p => p.id);
    const histIds = hist.map(h => h.id);
    const [pendAttR, histAttR] = await Promise.all([
      pendIds.length ? supabase.from('pendiente_attachments').select('*').in('pendiente_id', pendIds) : Promise.resolve(empty),
      histIds.length ? supabase.from('historial_attachments').select('*').in('historial_id', histIds) : Promise.resolve(empty),
    ]);
    const info = infoR.data || [];
    const photos = photosR.data || [];
    const pendAtt = pendAttR.data || [];
    const histAtt = histAttR.data || [];

    state.vehicles = (vehicles || []).map(v => ({
      ...v,
      info: info.filter(i => i.vehicle_id === v.id),
      photos: photos.filter(p => p.vehicle_id === v.id),
      pendientes: pend.filter(p => p.vehicle_id === v.id).map(p => ({ ...p, attachments: pendAtt.filter(a => a.pendiente_id === p.id) })),
      historial: hist.filter(h => h.vehicle_id === v.id).map(h => ({ ...h, attachments: histAtt.filter(a => a.historial_id === h.id) })),
      documents: documents.filter(d => d.vehicle_id === v.id),
      diagrams: diagrams.filter(d => d.vehicle_id === v.id),
      fuelLog: fuelLog.filter(f => f.vehicle_id === v.id),
    }));
    const isSpecialView = SPECIAL_VIEWS.includes(state.activeId);
    if(!state.activeId || (!isSpecialView && !state.vehicles.some(v => v.id === state.activeId))){
      state.activeId = HOME_VIEW;
    }
    setStatus('');
    render();
  }catch(err){
    console.error(err);
    setStatus('No se pudo cargar la información. Revisa tu conexión.');
  }
}

}

function fuelStatsFor(v){
  const sorted = [...(v.fuelLog || [])].sort((a, b) => (a.fill_date < b.fill_date ? -1 : a.fill_date > b.fill_date ? 1 : (a.created_at < b.created_at ? -1 : 1)));
  const withRate = [];
  let prevOdo = null;
  for(const f of sorted){
    let rate = null;
    if(f.full_tank && prevOdo != null && f.odometer_value != null && f.volume){
      const dist = f.odometer_value - prevOdo;
      if(dist > 0) rate = dist / f.volume;
    }
    if(f.odometer_value != null) prevOdo = f.odometer_value;
    withRate.push({ ...f, rate });
  }
  return withRate.reverse();
}

function fileToDataUrl(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function loadImageEl(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
async function compressImage(file, maxDim = 1600, quality = 0.82){
  const dataUrl = await fileToDataUrl(file);
  const img = await loadImageEl(dataUrl);
  let { width: w, height: h } = img;
  if(w > maxDim || h > maxDim){
    const scale = maxDim / Math.max(w, h);
    w = Math.round(w * scale); h = Math.round(h * scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
}

async function uploadAttachment(file, folder){
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf';
  const isHeic = /\.(heic|heif)$/i.test(file.name || '') || /heic|heif/i.test(file.type || '');
  if(isHeic){
    alert('Este archivo parece estar en formato HEIC (común en fotos de iPhone), que el navegador no puede procesar. Expórtalo como JPG o PNG desde Fotos y vuelve a intentarlo.');
    return null;
  }
  if(!isImage && !isPdf){ alert('Solo se aceptan imágenes o PDF'); return null; }
  setStatus('Subiendo archivo…');
  try{
    let blob = file, ext = 'pdf', contentType = 'application/pdf';
    if(isImage){
      blob = await compressImage(file);
      ext = 'jpg'; contentType = 'image/jpeg';
    }
    const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error } = await supabase.storage.from('bitacora').upload(path, blob, { contentType, upsert: false });
    if(error){ console.error(error); alert('No se pudo subir el archivo. Revisa tu conexión e intenta de nuevo.'); return null; }
    const { data } = supabase.storage.from('bitacora').getPublicUrl(path);
    return { url: data.publicUrl, kind: isImage ? 'image' : 'pdf', name: file.name };
  }catch(err){
    console.error('Error al subir archivo', err);
    alert('No se pudo procesar este archivo. Si es una foto, intenta exportarla como JPG o PNG primero e inténtalo de nuevo.');
    return null;
  }finally{
    setStatus('');
  }
}

function imageUrlToDataUrl(url){
  return fetch(url).then(r => r.blob()).then(blob => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  }));
}

// --- PDF export ------------------------------------------------------
async function exportVehiclePDF(vid){
  const v = findVehicle(vid);
  if(!v) return;
  const btn = document.querySelector(`.export-pdf-btn[data-vid="${vid}"]`);
  if(btn) btn.disabled = true;
  const prevLabel = btn ? btn.textContent : '';
  if(btn) btn.textContent = '⏳';
  try{
    const { jsPDF } = await import('https://esm.sh/jspdf@2.5.1');
    const unit = v.odometer_unit || 'km';
    const doc = new jsPDF({ unit: 'mm', format: 'letter' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const marginX = 15;
    let y = 18;

    function ensureSpace(h){
      if(y + h > pageH - 15){ doc.addPage(); y = 18; }
    }
    function heading(text){
      ensureSpace(10);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
      doc.text(text, marginX, y);
      y += 7;
      doc.setFont('helvetica', 'normal');
    }
    function line(text, size = 10){
      doc.setFontSize(size);
      const wrapped = doc.splitTextToSize(text, pageW - marginX * 2);
      wrapped.forEach(l => { ensureSpace(6); doc.text(l, marginX, y); y += 5.3; });
    }

    doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
    doc.text(`Bitácora de Mantenimiento — ${v.name}`, marginX, y);
    y += 7;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(120);
    doc.text(`Generado el ${new Date().toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' })}`, marginX, y);
    doc.setTextColor(0);
    y += 9;

    if(v.type) line(`Tipo: ${v.type}`);
    if(v.odometer_value != null) line(`${unit === 'km' ? 'Kilometraje' : 'Lectura'} actual: ${numFmt(v.odometer_value)} ${unit}`);
    y += 3;

    const fichaRowsPdf = v.info.filter(row => row.category === 'ficha_tecnica');
    const generalInfoRowsPdf = v.info.filter(row => row.category !== 'ficha_tecnica');

    heading('Ficha técnica');
    if(fichaRowsPdf.length) fichaRowsPdf.forEach(row => line(`${row.label}: ${row.value || '—'}`));
    else line('Sin datos de ficha técnica registrados.');
    y += 3;

    heading('Información general');
    if(generalInfoRowsPdf.length) generalInfoRowsPdf.forEach(row => line(`${row.label}: ${row.value || '—'}`));
    else line('Sin información registrada.');
    y += 3;

    heading('Documentos importantes');
    if(v.documents.length) v.documents.forEach(d => line(`${d.name}${d.expiry_date ? ` — vence ${fmtDate(d.expiry_date)}` : ''}`));
    else line('Sin documentos registrados.');
    y += 3;

    heading('Pendientes');
    if(v.pendientes.length) v.pendientes.forEach(p => line(`${p.checked ? '[x]' : '[ ]'} ${p.text}`));
    else line('Sin pendientes.');
    y += 3;

    heading('Historial de mantenimiento');
    if(v.historial.length){
      v.historial.forEach(h => {
        ensureSpace(11);
        doc.setFont('helvetica', 'bold');
        line(`${fmtDate(h.service_date)} — ${h.description}`, 10.5);
        doc.setFont('helvetica', 'normal');
        const details = [];
        if(h.provider) details.push(`Proveedor: ${h.provider}`);
        if(h.cost != null) details.push(`Costo: ${fmtCost(h.cost)}`);
        if(h.odometer_value != null) details.push(`${unit === 'km' ? 'Kilometraje' : 'Lectura'}: ${numFmt(h.odometer_value)} ${unit}`);
        if(h.reminder_date) details.push(`Recordatorio: ${fmtDate(h.reminder_date)}`);
        if(details.length) line(details.join('   ·   '), 9);
        y += 2;
      });
    } else {
      line('Sin historial registrado.');
    }
    y += 3;

    heading('Consumo de combustible');
    const fuelPdf = fuelStatsFor(v);
    if(fuelPdf.length){
      fuelPdf.forEach(f => {
        const parts = [`${numFmt(f.volume)} ${f.volume_unit || 'L'}${f.full_tank ? '' : ' (parcial)'}`];
        if(f.odometer_value != null) parts.push(`${numFmt(f.odometer_value)} ${unit}`);
        if(f.cost != null) parts.push(fmtCost(f.cost));
        if(f.rate != null) parts.push(`${f.rate.toFixed(1)} ${unit}/${f.volume_unit || 'L'}`);
        line(`${fmtDate(f.fill_date)} — ${parts.join('   ·   ')}`, 9.5);
      });
    } else {
      line('Sin cargas de combustible registradas.');
    }

    const photoItems = [
      ...v.photos.map(p => ({ url: p.url, caption: 'Foto del vehículo' })),
      ...v.pendientes.flatMap(p => p.attachments.filter(a => a.kind === 'image').map(a => ({ url: a.url, caption: `Pendiente: ${p.text}` }))),
      ...v.historial.flatMap(h => h.attachments.filter(a => a.kind === 'image').map(a => ({ url: a.url, caption: `${fmtDate(h.service_date)} — ${h.description}` }))),
      ...v.diagrams.filter(d => d.kind === 'image').map(d => ({ url: d.url, caption: `Diagrama: ${d.name || 'sin nombre'}` })),
    ];
    if(photoItems.length){
      doc.addPage(); y = 18;
      heading('Fotos');
      for(const item of photoItems){
        try{
          const dataUrl = await imageUrlToDataUrl(item.url);
          const img = await loadImageEl(dataUrl);
          const maxW = pageW - marginX * 2, maxH = 75;
          const scale = Math.min(maxW / img.width, maxH / img.height, 1);
          const w = img.width * scale, h = img.height * scale;
          ensureSpace(h + 10);
          doc.addImage(dataUrl, 'JPEG', marginX, y, w, h);
          y += h + 3;
          doc.setFontSize(8.3); doc.setTextColor(110);
          doc.text(item.caption, marginX, y);
          doc.setTextColor(0);
          y += 7;
        }catch(err){ console.error('No se pudo cargar una imagen para el PDF', err); }
      }
    }

    const fileSlug = v.name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'vehiculo';
    const today = new Date();
    const dateSlug = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    doc.save(`bitacora-${fileSlug}-${dateSlug}.pdf`);
  }catch(err){
    console.error(err);
    alert('No se pudo generar el PDF. Revisa tu conexión e intenta de nuevo.');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = prevLabel || '📄'; }
  }
}

function findHistorial(id){
  for(const v of state.vehicles){ const h = v.historial.find(x => x.id === id); if(h) return h; }
  return null;
}
function findInfoRow(id){
  for(const v of state.vehicles){ const i = v.info.find(x => x.id === id); if(i) return i; }
  return null;
}
function findVehicle(id){ return state.vehicles.find(v => v.id === id); }
function findProvider(id){ return state.providers.find(p => p.id === id); }
function findDocument(id){
  for(const v of state.vehicles){ const d = v.documents.find(x => x.id === id); if(d) return d; }
  return null;
}
function findDiagram(id){
  for(const v of state.vehicles){ const d = v.diagrams.find(x => x.id === id); if(d) return d; }
  return null;
}
function findTechRef(id){ return state.techReference.find(t => t.id === id); }
function findServicesForProvider(name){
  const nameLower = (name || '').trim().toLowerCase();
  if(!nameLower) return [];
  const results = [];
  for(const v of state.vehicles){
    for(const h of v.historial){
      if((h.provider || '').trim().toLowerCase() === nameLower){
        results.push({ vehicleId: v.id, vehicleName: v.name, h });
      }
    }
  }
  results.sort((a, b) => (a.h.service_date < b.h.service_date ? 1 : -1));
  return results;
}

  } else if(action === 'edit-hist-desc'){

    onSave = async val => { if(val) await supabase.from('historial').update({ description: val }).eq('id', id); };
  } else if(action === 'edit-hist-provider'){

  } else if(action === 'edit-hist-reminder'){

    value = h.reminder_date || '';
    onSave = async val => { await supabase.from('historial').update({ reminder_date: val || null }).eq('id', id); };
  } else if(action === 'edit-hist-odometer'){
    const id = el.dataset.histId; const h = findHistorial(id);

    onSave = async val => {

    value = v.odometer_value != null ? String(v.odometer_value) : '';
    onSave = async val => {
      const num = val === '' ? null : parseFloat(val.replace(/[^0-9.]/g, ''));
      await supabase.from('vehicles').update({ odometer_value: (num == null || isNaN(num)) ? null : num }).eq('id', vid);

    value = v.odometer_unit || 'km';
    onSave = async val => { await supabase.from('vehicles').update({ odometer_unit: val || 'km' }).eq('id', vid); };
  } else if(action === 'edit-provider-name'){
    const pid = el.dataset.pid; const p = findProvider(pid);
    value = p.name;
    onSave = async val => { if(val) await supabase.from('providers').update({ name: val }).eq('id', pid); };
  } else if(action === 'edit-provider-category'){
    const pid = el.dataset.pid; const p = findProvider(pid);

  } else if(action === 'edit-provider-phone'){

  } else if(action === 'edit-provider-address'){
    const pid = el.dataset.pid; const p = findProvider(pid);
    value = p.address;
    onSave = async val => { await supabase.from('providers').update({ address: val }).eq('id', pid); };
  } else if(action === 'edit-provider-notes'){
    const pid = el.dataset.pid; const p = findProvider(pid);
    value = p.notes;
    onSave = async val => { await supabase.from('providers').update({ notes: val }).eq('id', pid); };
  } else if(action === 'edit-doc-name'){
    const id = el.dataset.docId; const d = findDocument(id);
    value = d.name;
    onSave = async val => { if(val) await supabase.from('vehicle_documents').update({ name: val }).eq('id', id); };
  } else if(action === 'edit-doc-expiry'){
    const id = el.dataset.docId; const d = findDocument(id);
    value = d.expiry_date || '';
    onSave = async val => { await supabase.from('vehicle_documents').update({ expiry_date: val || null }).eq('id', id); };
  } else if(action === 'edit-diagram-name'){
    const id = el.dataset.diagramId; const d = findDiagram(id);
    value = d.name || '';
    onSave = async val => { await supabase.from('vehicle_diagrams').update({ name: val || null }).eq('id', id); };
  } else if(action === 'edit-techref-title'){
    const id = el.dataset.techrefId; const t = findTechRef(id);
    value = t.title;
    onSave = async val => { if(val) await supabase.from('tech_reference').update({ title: val }).eq('id', id); };
  } else if(action === 'edit-techref-content'){
    const id = el.dataset.techrefId; const t = findTechRef(id);
    value = t.content || '';
    onSave = async val => { await supabase.from('tech_reference').update({ content: val || null }).eq('id', id); };
  } else return;

  const isTextarea = action === 'edit-techref-content';
  const input = document.createElement(isTextarea ? 'textarea' : 'input');
  if(!isTextarea) input.type = (action === 'edit-hist-reminder' || action === 'edit-doc-expiry') ? 'date' : 'text';
  else input.rows = 3;
  input.value = value || '';
  input.className = 'inline-edit-input';
  el.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = async commit => {
    if(done) return; done = true;
    if(commit) await onSave(input.value.trim());
    loadAll();
  };
  input.addEventListener('keydown', ev => {
    if(ev.key === 'Enter' && !isTextarea){ ev.preventDefault(); finish(true); }
    else if(ev.key === 'Escape'){ ev.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

async function handleClick(e){
  if(e.target === lightbox){ closeLightbox(); return; }
  const thumbImg = e.target.closest('.photo-thumb') && e.target.tagName === 'IMG' ? e.target : null;
  if(thumbImg){ openLightboxImage(thumbImg.dataset.full || thumbImg.src); return; }

  const tab = e.target.closest('.vehicle-tab, .global-view-tab, .home-nav-card');
  if(tab){ state.activeId = tab.dataset.vid; state.infoEditMode = false; render(); return; }

  const gremind = e.target.closest('.global-reminder-pill');
  if(gremind){ state.activeId = gremind.dataset.vid; state.infoEditMode = false; render(); return; }

  if(e.target.id === 'addVehicleBtn'){
    state.showAddVehicleForm = !state.showAddVehicleForm;
    render();
    return;
  }

  const jumpVehicle = e.target.closest('[data-action="jump-vehicle"]');
  if(jumpVehicle){ state.activeId = jumpVehicle.dataset.vid; state.infoEditMode = false; render(); return; }

  const infoEditToggle = e.target.closest('.edit-info-toggle');
  if(infoEditToggle){ state.infoEditMode = !state.infoEditMode; render(); return; }

  const pdfBtn = e.target.closest('.export-pdf-btn');
  if(pdfBtn){ exportVehiclePDF(pdfBtn.dataset.vid); return; }

  const editTarget = e.target.closest('[data-action]');
  if(editTarget && editTarget.tagName === 'SPAN'){ handleEditableSpan(editTarget); return; }

  const delVehicle = e.target.closest('.delete-vehicle');
  if(delVehicle){
    if(!confirm('¿Eliminar este vehículo y todo su historial? No se puede deshacer.')) return;
    await supabase.from('vehicles').delete().eq('id', delVehicle.dataset.vid);
    state.activeId = null;
    state.infoEditMode = false;

  }

  const delInfo = e.target.closest('.delete-info');
  if(delInfo){ await supabase.from('vehicle_info').delete().eq('id', delInfo.dataset.infoId); loadAll(); return; }

  const addPhotoBtn = e.target.closest('.add-vehicle-photo');
  if(addPhotoBtn){ addPhotoBtn.parentElement.querySelector('.vehicle-photo-input').click(); return; }

  const rmPhoto = e.target.closest('.photo-remove');

    loadAll();

    else await supabase.from('historial_attachments').delete().eq('id', id);

    const table = item.dataset.kind === 'general' ? 'general_pendientes' : 'pendientes';

  if(resetBtn){
    await supabase.from('pendientes').update({ checked: false }).eq('vehicle_id', resetBtn.dataset.vid);
    loadAll();
    return;
  }

  const resetGeneralBtn = e.target.closest('.reset-general-checklist');
  if(resetGeneralBtn){
    await supabase.from('general_pendientes').update({ checked: false }).not('id', 'is', null);

    await supabase.from('tech_reference').update({ image_url: null }).eq('id', rmTechRefImage.dataset.techrefId);
    loadAll();
    return;
  }

  const fichaQuickAdd = e.target.closest('.ficha-quick-add');
  if(fichaQuickAdd){
    const vid = fichaQuickAdd.dataset.vid;
    const label = fichaQuickAdd.dataset.label;
    const v = findVehicle(vid);
    await supabase.from('vehicle_info').insert({ vehicle_id: vid, label, value: '', category: 'ficha_tecnica', sort_order: v ? v.info.length : 0 });
    loadAll();
    return;
  }

  const delLog = e.target.closest('.delete-log');
  if(delLog){
    const id = delLog.closest('.log-entry').dataset.histId;
    await supabase.from('historial').delete().eq('id', id);
    loadAll();
    return;
  }

  const delProvider = e.target.closest('.delete-provider');
  if(delProvider){
    if(!confirm('¿Eliminar este proveedor/taller?')) return;
    await supabase.from('providers').delete().eq('id', delProvider.dataset.pid);
    loadAll();
    return;
  }

  const docAttachBtn = e.target.closest('.doc-attach-btn');
  if(docAttachBtn){ docAttachBtn.parentElement.querySelector('.doc-attach-input').click(); return; }

  const delDoc = e.target.closest('.delete-doc');
  if(delDoc){
    await supabase.from('vehicle_documents').delete().eq('id', delDoc.dataset.docId);
    loadAll();
    return;
  }

  const addDiagramBtn = e.target.closest('.add-vehicle-diagram');
  if(addDiagramBtn){ addDiagramBtn.parentElement.querySelector('.vehicle-diagram-input').click(); return; }

  const rmDiagram = e.target.closest('.diagram-remove');
  if(rmDiagram){
    await supabase.from('vehicle_diagrams').delete().eq('id', rmDiagram.dataset.diagramId);
    loadAll();
    return;
  }

  const delFuel = e.target.closest('.delete-fuel');
  if(delFuel){
    await supabase.from('fuel_log').delete().eq('id', delFuel.dataset.fuelId);
    loadAll();
    return;
  }

  if(e.target.id === 'downloadBackupBtn'){ downloadBackup(e.target); return; }

  if(e.target.id === 'removePasswordBtn'){
    if(!confirm('¿Quitar la contraseña? Cualquiera con el link podrá entrar sin pedirla.')) return;
    await supabase.from('app_settings').delete().eq('key', 'access_password_hash');
    loadAll();
    return;
  }

  if(e.target.id === 'lockDeviceBtn'){
    localStorage.removeItem(ACCESS_OK_KEY);
    location.reload();
    return;
  }

  if(e.target.id === 'enablePushBtn'){ subscribeToPush(e.target); return; }
  if(e.target.id === 'disablePushBtn'){ unsubscribeFromPush(e.target); return; }
}

async function handleChange(e){
  const t = e.target;
  if(t.classList.contains('vehicle-photo-input')){
    const file = t.files[0]; if(!file) return;
    const vid = t.dataset.vid;
    const att = await uploadAttachment(file, `vehicle-photos/${vid}`);
    t.value = '';
    if(!att) return;
    await supabase.from('vehicle_photos').insert({ vehicle_id: vid, url: att.url });
    loadAll();
    return;
  }
  if(t.classList.contains('log-attach-input')){
    const file = t.files[0]; if(!file) return;
    const kind = t.dataset.kind, id = t.dataset.id;
    const att = await uploadAttachment(file, `${kind}-attachments/${id}`);
    t.value = '';
    if(!att) return;
    if(kind === 'pend') await supabase.from('pendiente_attachments').insert({ pendiente_id: id, kind: att.kind, url: att.url, name: att.name });
    else await supabase.from('historial_attachments').insert({ historial_id: id, kind: att.kind, url: att.url, name: att.name });
    loadAll();
    return;
  }
  if(t.matches('.check-item input[type="checkbox"]')){
    const item = t.closest('.check-item');
    const table = item.dataset.kind === 'general' ? 'general_pendientes' : 'pendientes';
    await supabase.from(table).update({ checked: t.checked }).eq('id', item.dataset.pendId);
    loadAll();
    return;
  }
  if(t.classList.contains('pend-priority-select')){
    const item = t.closest('.check-item');
    const table = item.dataset.kind === 'general' ? 'general_pendientes' : 'pendientes';
    await supabase.from(table).update({ priority: t.value || null }).eq('id', item.dataset.pendId);
    loadAll();
    return;
  }
  if(t.classList.contains('doc-attach-input')){
    const file = t.files[0]; if(!file) return;
    const docId = t.dataset.docId;
    const att = await uploadAttachment(file, `vehicle-documents/${docId}`);
    t.value = '';
    if(!att) return;
    await supabase.from('vehicle_documents').update({ file_url: att.url, file_name: att.name }).eq('id', docId);
    loadAll();
    return;
  }
  if(t.classList.contains('vehicle-diagram-input')){
    const file = t.files[0]; if(!file) return;
    const vid = t.dataset.vid;
    const att = await uploadAttachment(file, `vehicle-diagrams/${vid}`);
    t.value = '';
    if(!att) return;
    await supabase.from('vehicle_diagrams').insert({ vehicle_id: vid, name: att.name, url: att.url, kind: att.kind });
    loadAll();
    return;
  }
  if(t.classList.contains('techref-image-input')){
    const file = t.files[0]; if(!file) return;
    const techRefId = t.dataset.techrefId;
    const att = await uploadAttachment(file, `tech-reference/${techRefId}`);
    t.value = '';
    if(!att) return;
    await supabase.from('tech_reference').update({ image_url: att.url }).eq('id', techRefId);
    loadAll();
    return;
  }
  if(t.classList.contains('log-repeat-select') || t.classList.contains('log-date-input')){
    const form = t.closest('.add-log-form');
    if(!form) return;
    const repeatSel = form.querySelector('.log-repeat-select');
    const dateInput = form.querySelector('.log-date-input');
    const reminderInput = form.querySelector('.log-reminder-input');
    const months = repeatSel ? parseInt(repeatSel.value, 10) : NaN;
    if(!isNaN(months) && dateInput.value) reminderInput.value = addMonths(dateInput.value, months);
    return;
  }
}

document.addEventListener('submit', async e => {
  e.preventDefault();
  try{
    await handleSubmit(e);
  }catch(err){
    console.error('Error inesperado', err);
    alert('Ocurrió un error inesperado. Revisa tu conexión e intenta de nuevo.');
  }
});

async function handleSubmit(e){
  const form = e.target;

  if(form.id === 'addVehicleForm'){
    const name = document.getElementById('newVehicleName').value.trim();
    const type = document.getElementById('newVehicleType').value.trim();
    if(!name) return;
    const { data, error } = await supabase.from('vehicles').insert({ name, type, sort_order: state.vehicles.length }).select().single();
    if(error){ alert('No se pudo crear el vehículo'); return; }
    state.showAddVehicleForm = false;
    state.activeId = data.id;
    state.infoEditMode = false;
    loadAll();
    return;
  }

  if(form.classList.contains('add-info-form')){
    const vid = form.dataset.vid;
    const category = form.dataset.category || null;
    const label = form.querySelector('.info-label-input').value.trim();
    const value = form.querySelector('.info-value-input').value.trim();
    if(!label) return;
    const v = findVehicle(vid);
    await supabase.from('vehicle_info').insert({ vehicle_id: vid, label, value, category, sort_order: v ? v.info.length : 0 });
    form.reset();
    loadAll();
    return;
  }

  if(form.classList.contains('add-check-form')){
    const vid = form.dataset.vid;
    const input = form.querySelector('.check-input');
    const text = input.value.trim();
    if(!text) return;
    const v = findVehicle(vid);
    await supabase.from('pendientes').insert({ vehicle_id: vid, text, checked: false, sort_order: v ? v.pendientes.length : 0 });
    input.value = '';
    loadAll();
    return;
  }

  if(form.classList.contains('add-general-check-form')){
    const input = form.querySelector('.check-input');
    const text = input.value.trim();
    if(!text) return;
    await supabase.from('general_pendientes').insert({ text, checked: false, sort_order: state.generalPendientes.length });
    input.value = '';
    loadAll();
    return;
  }

  if(form.id === 'lockForm'){
    const pwd = document.getElementById('lockPasswordInput').value;
    await attemptUnlock(pwd);
    return;
  }

  if(form.id === 'setPasswordForm'){
    const pwd = document.getElementById('newPasswordInput').value;
    if(!pwd || pwd.length < 4){ alert('La contraseña debe tener al menos 4 caracteres.'); return; }
    const hash = await sha256Hex(pwd);
    await supabase.from('app_settings').upsert({ key: 'access_password_hash', value: hash, updated_at: new Date().toISOString() });
    localStorage.setItem(ACCESS_OK_KEY, '1');
    form.reset();
    loadAll();
    return;
  }

  if(form.classList.contains('add-fuel-form')){
    const vid = form.dataset.vid;
    const date = form.querySelector('.fuel-date-input').value;
    const odometerRaw = form.querySelector('.fuel-odo-input').value.trim();
    const volumeRaw = form.querySelector('.fuel-volume-input').value.trim();
    const unit = form.querySelector('.fuel-unit-select').value;
    const costRaw = form.querySelector('.fuel-cost-input').value.trim();
    const fullTank = form.querySelector('.fuel-full-input').checked;
    if(!date || !volumeRaw) return;
    const odometer = odometerRaw === '' ? null : parseFloat(odometerRaw.replace(/[^0-9.]/g, ''));
    const volume = parseFloat(volumeRaw.replace(/[^0-9.]/g, ''));
    const cost = costRaw === '' ? null : parseFloat(costRaw.replace(/[^0-9.]/g, ''));
    if(isNaN(volume)) return;
    await supabase.from('fuel_log').insert({
      vehicle_id: vid, fill_date: date,
      odometer_value: (odometer == null || isNaN(odometer)) ? null : odometer,
      volume, volume_unit: unit,
      cost: (cost == null || isNaN(cost)) ? null : cost,
      full_tank: fullTank,
    });
    if(odometer != null && !isNaN(odometer)){
      const v = findVehicle(vid);
      if(v && (v.odometer_value == null || odometer > v.odometer_value)){
        await supabase.from('vehicles').update({ odometer_value: odometer }).eq('id', vid);
      }
    }
    form.reset();
    form.querySelector('.fuel-full-input').checked = true;
    loadAll();
    return;
  }

  if(form.id === 'partsSearchForm'){
    const q = form.querySelector('.parts-search-input').value.trim();
    if(!q) return;
    state.partsSearchQuery = q;
    render();
    return;
  }

  if(form.id === 'addTechRefForm'){
    const category = form.querySelector('.techref-category-input').value.trim();
    const title = form.querySelector('.techref-title-input').value.trim();
    const vehicleId = form.querySelector('.techref-vehicle-input').value || null;
    const content = form.querySelector('.techref-content-input').value.trim();
    if(!category || !title) return;
    await supabase.from('tech_reference').insert({
      category, title, content: content || null, vehicle_id: vehicleId, sort_order: state.techReference.length,
    });
    form.reset();
    loadAll();
    return;
  }

  if(form.classList.contains('add-log-form')){
    const vid = form.dataset.vid;
    const date = form.querySelector('.log-date-input').value;
    const desc = form.querySelector('.log-desc-input').value.trim();
    const provider = form.querySelector('.log-provider-input').value.trim();
    const costRaw = form.querySelector('.log-cost-input').value.trim();
    const odometerRaw = form.querySelector('.log-odometer-input').value.trim();
    const reminderRaw = form.querySelector('.log-reminder-input').value;
    if(!date || !desc) return;
    const cost = costRaw === '' ? null : parseFloat(costRaw.replace(/[^0-9.]/g, ''));
    const odometer = odometerRaw === '' ? null : parseFloat(odometerRaw.replace(/[^0-9.]/g, ''));
    await supabase.from('historial').insert({
      vehicle_id: vid, service_date: date, description: desc, provider,
      cost: isNaN(cost) ? null : cost,
      odometer_value: (odometer == null || isNaN(odometer)) ? null : odometer,
      reminder_date: reminderRaw || null,
    });
    if(odometer != null && !isNaN(odometer)){
      const v = findVehicle(vid);
      if(v && (v.odometer_value == null || odometer > v.odometer_value)){
        await supabase.from('vehicles').update({ odometer_value: odometer }).eq('id', vid);
      }
    }
    form.reset();
    loadAll();
    return;
  }

  if(form.classList.contains('add-doc-form')){
    const vid = form.dataset.vid;
    const name = form.querySelector('.doc-name-input').value.trim();
    const expiry = form.querySelector('.doc-expiry-input').value;
    if(!name) return;
    await supabase.from('vehicle_documents').insert({ vehicle_id: vid, name, expiry_date: expiry || null });
    form.reset();
    loadAll();
    return;
  }

  if(form.id === 'addProviderForm'){
    const name = form.querySelector('.provider-name-input').value.trim();
    const category = form.querySelector('.provider-category-input').value.trim();
    const phone = form.querySelector('.provider-phone-input').value.trim();
    const address = form.querySelector('.provider-address-input').value.trim();
    if(!name) return;
    await supabase.from('providers').insert({
      name, category, phone, address, sort_order: state.providers.length,
    });
    form.reset();
    loadAll();
    return;
  }
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();

// --- realtime: any change from any device reloads this view -----------
function subscribeRealtime(){
  const tables = ['vehicles', 'vehicle_info', 'vehicle_photos', 'pendientes', 'pendiente_attachments', 'historial', 'historial_attachments', 'providers', 'vehicle_documents', 'vehicle_diagrams', 'general_pendientes', 'tech_reference', 'fuel_log'];
  const channel = supabase.channel('bitacora-changes');
  tables.forEach(t => {
    channel.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => scheduleReload());
  });
  channel.subscribe();
}
let reloadTimer = null;
function scheduleReload(){ clearTimeout(reloadTimer); reloadTimer = setTimeout(loadAll, 400); }

// --- respaldo de datos --------------------------------------------------
async function downloadBackup(btn){
  const original = btn.textContent;
  btn.textContent = 'Preparando…';
  btn.disabled = true;
  try{
    const tables = ['vehicles', 'vehicle_info', 'vehicle_photos', 'pendientes', 'pendiente_attachments', 'historial', 'historial_attachments', 'providers', 'vehicle_documents', 'vehicle_diagrams', 'general_pendientes', 'tech_reference', 'fuel_log'];
    const results = await Promise.all(tables.map(t => supabase.from(t).select('*')));
    const backup = { exported_at: new Date().toISOString(), app: 'Bitácora de Mantenimiento' };
    tables.forEach((t, i) => { backup[t] = results[i].data || []; });
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `bitacora-respaldo-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }catch(err){
    console.error(err);
    alert('No se pudo generar el respaldo.');
  }finally{
    btn.textContent = original;
    btn.disabled = false;
  }
}

// --- acceso con contraseña compartida -----------------------------------
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkAccessGate(){
  if(localStorage.getItem(ACCESS_OK_KEY) === '1') return true;
  try{
    const { data } = await supabase.from('app_settings').select('value').eq('key', 'access_password_hash').maybeSingle();
    const hash = data?.value;
    if(!hash) return true;
    showLockScreen();
    return false;
  }catch(err){
    console.error(err);
    return true;
  }
}

function showLockScreen(){
  document.querySelector('.page').style.display = 'none';
  document.getElementById('lockScreen').hidden = false;
  setTimeout(() => document.getElementById('lockPasswordInput')?.focus(), 50);
}

async function attemptUnlock(pwd){
  const errEl = document.getElementById('lockError');
  errEl.hidden = true;
  try{
    const { data } = await supabase.from('app_settings').select('value').eq('key', 'access_password_hash').maybeSingle();
    const hash = data?.value;
    const enteredHash = await sha256Hex(pwd || '');
    if(hash && enteredHash === hash){
      localStorage.setItem(ACCESS_OK_KEY, '1');
      document.getElementById('lockScreen').hidden = true;
      document.querySelector('.page').style.display = '';
      boot();
    }else{
      errEl.textContent = 'Contraseña incorrecta. Intenta de nuevo.';
      errEl.hidden = false;
      const input = document.getElementById('lockPasswordInput');
      input.value = '';
      input.focus();
    }
  }catch(err){
    console.error(err);
    errEl.textContent = 'No se pudo verificar la contraseña. Revisa tu conexión.';
    errEl.hidden = false;
  }
}

// --- notificaciones push --------------------------------------------------
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function subscribeToPush(btn){
  btn.textContent = 'Activando…';
  btn.disabled = true;
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){ render(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    }
    const json = sub.toJSON();
    await supabase.from('push_subscriptions').upsert(
      { endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth },
      { onConflict: 'endpoint' }
    );
    localStorage.setItem(PUSH_SUBSCRIBED_KEY, '1');
    render();
  }catch(err){
    console.error(err);
    alert('No se pudieron activar las notificaciones en este dispositivo.');
    render();
  }
}

async function unsubscribeFromPush(btn){
  btn.disabled = true;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      await supabase.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
      await sub.unsubscribe();
    }
    localStorage.removeItem(PUSH_SUBSCRIBED_KEY);
    render();
  }catch(err){
    console.error(err);
    alert('No se pudo desactivar.');
    render();
  }
}

// --- arranque ------------------------------------------------------------
async function boot(){
  const ok = await checkAccessGate();
  if(!ok) return;
  loadAll();
  subscribeRealtime();
}
boot();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(err => console.error('No se pudo registrar el service worker', err));
  });
}
